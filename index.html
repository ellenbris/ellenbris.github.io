<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ellen Brisley - Hardware & Data Analysis Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#131e32',
                            900: '#0f172a',
                            950: '#080d1a',
                        },
                        brand: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'Consolas', 'monospace']
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .bg-grid-pattern {
            background-size: 30px 30px;
            background-image: 
                linear-gradient(to right, rgba(148, 163, 184, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(148, 163, 184, 0.05) 1px, transparent 1px);
        }

        .dark .bg-grid-pattern {
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col bg-grid-pattern antialiased selection:bg-brand-500 selection:text-white">

    <header class="sticky top-0 z-30 backdrop-blur-md bg-white/80 dark:bg-slate-950/80 border-b border-slate-200 dark:border-slate-800/80 transition-colors">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-4 w-full sm:w-auto justify-between sm:justify-start">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-brand-500/20">
                        <i class="fa-solid font-mono text-lg">&lt;/&gt;</i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">Ellen Brisley</h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Engineering Physics Student</p>
                    </div>
                </div>

                <!-- Mobile theme toggle controls -->
                <div class="flex items-center gap-2 sm:hidden">
                    <button id="themeToggleMobile" class="p-2.5 rounded-lg border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                        <i class="fa-solid fa-moon dark:hidden"></i>
                        <i class="fa-solid fa-sun hidden dark:inline"></i>
                    </button>
                </div>
            </div>

            <!-- Social Links (Email & LinkedIn only) -->
            <div class="flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-end">
                <div class="flex items-center space-x-3 text-slate-600 dark:text-slate-400">
                    <a href="https://ca.linkedin.com/in/ellen-brisley-enphstudent" target="_blank" rel="noopener" class="p-2 rounded-lg hover:text-brand-500 dark:hover:text-brand-400 hover:bg-slate-100 dark:hover:bg-slate-800/60 transition" title="LinkedIn Profile">
                        <i class="fa-brands fa-linkedin text-xl"></i>
                    </a>
                    <a href="mailto:ecbriz26@outlook.com" class="p-2 rounded-lg hover:text-brand-500 dark:hover:text-brand-400 hover:bg-slate-100 dark:hover:bg-slate-800/60 transition" title="Send Email">
                        <i class="fa-solid fa-envelope text-xl"></i>
                    </a>
                </div>

                <div class="h-5 w-px bg-slate-200 dark:bg-slate-800 hidden sm:block"></div>

                <div class="flex items-center gap-2">
                    <button id="themeToggle" class="hidden sm:flex p-2.5 rounded-lg border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Toggle Theme">
                        <i class="fa-solid fa-moon dark:hidden"></i>
                        <i class="fa-solid fa-sun hidden dark:inline"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        <!-- Intro Statement -->
        <section class="mb-8">
            <div class="bg-gradient-to-r from-blue-500/10 via-indigo-500/5 to-transparent p-6 rounded-2xl border border-slate-200/80 dark:border-slate-800/80 backdrop-blur-sm">
                <p class="text-sm sm:text-base text-slate-700 dark:text-slate-300 leading-relaxed max-w-3xl">
                    I am interested in physics and hardware, exploring how it can be used in research, tech, and supporting communities!
                </p>
            </div>
        </section>

        <!-- Subgroup Category Filter Controls -->
        <section class="mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-200 dark:border-slate-800/80 pb-4">
            <div class="flex flex-wrap gap-2" id="filterTabs">
                <button onclick="filterProjects('all')" class="filter-btn active px-3.5 py-1.5 text-xs font-semibold rounded-full bg-brand-600 text-white transition">All Projects</button>
                <button onclick="filterProjects('hardware')" class="filter-btn px-3.5 py-1.5 text-xs font-medium rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 transition">Hardware</button>
                <button onclick="filterProjects('robotics')" class="filter-btn px-3.5 py-1.5 text-xs font-medium rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 transition">Robotics</button>
                <button onclick="filterProjects('data analysis')" class="filter-btn px-3.5 py-1.5 text-xs font-medium rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 transition">Data Analysis</button>
                <button onclick="filterProjects('other')" class="filter-btn px-3.5 py-1.5 text-xs font-medium rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 transition">Other</button>
            </div>
            <div class="text-xs text-slate-500 dark:text-slate-400 font-mono" id="projectCount">Showing 7 projects</div>
        </section>

        <!-- Container where projects render -->
        <section class="space-y-6" id="projectsGrid"></section>
    </main>

    <footer class="border-t border-slate-200 dark:border-slate-800/80 py-6 text-center text-xs text-slate-500 dark:text-slate-400 mt-12 bg-white/50 dark:bg-slate-950/50 backdrop-blur-sm">
        <div class="max-w-5xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-2">
            <div>
                © <span id="year">2026</span> Ellen Brisley. Hosted on <strong>GitHub Pages</strong>.
            </div>
            <div class="font-mono text-[11px] text-slate-400 dark:text-slate-500">
                HTML + CSS + JavaScript • Clean & Lightweight
            </div>
        </div>
    </footer>

    <script>
        // Official project list
        let initialProjects = [
            {
                id: '1',
                title: 'fA X-Ray Detector - Max Planck Institute For Nuclear Physics',
                category: 'hardware',
                image: 'images/xraysensorpcb.png',
                tags: ['KiCad'],
                github: '',
                demo: '',
                dots: [
                    'Multi-iteration design of multi-stage transimpedance amplifier',
                    'Large attention to limiting noise coupling and feedback capacitance',
                    'Tested with Sr90 and Fe55 sources',
                    'Replace ~20k euro X-ray detector in beamline'
                ]
            },
            {
                id: '2',
                title: 'Liquid Nitrogen Level Sensor - Max Planck Institute For Nuclear Physics',
                category: 'hardware',
                image: 'images/levelsensorfinal.jpg',
                tags: ['KiCad', 'Raspberry Pico', 'Solidworks'],
                github: '',
                demo: '',
                dots: [
                    'Designed 2-layer pcb to detect 50-150pF change in probe capacitance due to liquid nitrogen level change',
                    'Designed probe on Solidworks to fit inside superconducting magnet, choosing materials that function in cryogenic temperatures',
                    'Replace ~1k euro probe + long order lead time (1 of 3 of these magnets in the world)'
                ]
            },
            {
                id: '3',
                title: 'Helium Level Sensor Circuit - Max Planck Institute For Nuclear Physics',
                category: 'hardware',
                image: 'images/heliumsensorpcb.png',
                tags: ['KiCad', 'Raspberry Pico'],
                github: '',
                demo: '',
                dots: [
                    'Designed 2-layer pcb using 4-wire method to detect resistance change in probe due to liquid helium level change',
                    'Designed to avoid evaporation of helium',
                    'Replace ~5k euro probe + long order lead time (1 of 3 of these magnets in the world)'
                ]
            },
            {
                id: '4',
                title: 'Pump Valve Protection Circuit - Max Planck Institute For Nuclear Physics',
                category: 'hardware',
                image: 'images/scrollpump.png',
                tags: ['KiCad', 'Raspberry Pico', '3D Printing', 'Solidworks'],
                github: '',
                demo: '',
                dots: [
                    'Re-designed circuit that delays valve startup, to protect vacuum after power cut',
                    'Allows for circuit to fit tightly behind pump with no wires',
                    'Designed and printed box to fit pcb'
                ]
            },
            {
                id: '5',
                title: 'Compact BioSand Filter - Clear Cambodia',
                category: 'other',
                image: 'images/clearcambodia',
                tags: ['Solidworks', 'Water Testing', 'Experiment Design'],
                github: '',
                demo: 'https://sites.google.com/view/ellen-brisley-cambodia/home?authuser=0',
                dots: [
                    'Designed and developed prototype of compact BioSand Filter - see link in top right corner for more information',
                    'Led 2-month field experiment in Cambodia to evaluate filter efficiency; demonstrated filtration performance on par with control filters'
                ]
            },
            {
                id: '6',
                title: 'Mass Spectrometry Analysis - TRIUMF Particle Accelerator',
                category: 'data analysis',
                image: 'images/csanalysis',
                tags: ['Python', 'Likelihood Ratio Tests'],
                github: '',
                demo: 'https://www.linkedin.com/posts/ellen-brisley-enphstudent_triumf-recap-data-analysis-project-activity-7308404535637463042-7LMn/?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAADOkgj0BMPvd9dE7gpz3T5UTL3doQi4ZeBs',
                dots: [
                    'Python data analysis on neutron-deficient Cs/Ba isotopes and isomers - see link in top right corner for poster',
                    'Identified isomers as overlapping peaks, using likelihood ratio tests'
                ]
            },
            {
                id: '7',
                title: 'Autonomous Robot - Engineering Physics',
                category: 'robotics',
                image: 'images/robot',
                tags: ['OnShape', 'Prototyping', 'Laser Cutting', 'Circuit Troubleshooting'],
                github: '',
                demo: '',
                dots: [
                    'Robot autonomously navigates surface with line following, detecting objects and rescuing them',
                    'Designed and prototyped claw and linear actuator system with CAD and laser/waterjet cutting',
                    'Troubleshot circuits integrating ESP32, Hall-Effect/LiDAR, and rotary encoders'
                ]
            }
        ];

        let projects = initialProjects;
        let activeCategory = 'all';

        const themeToggleBtns = [document.getElementById('themeToggle'), document.getElementById('themeToggleMobile')];
        
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        themeToggleBtns.forEach(btn => {
            if (btn) {
                btn.addEventListener('click', () => {
                    if (document.documentElement.classList.contains('dark')) {
                        document.documentElement.classList.remove('dark');
                        localStorage.theme = 'light';
                    } else {
                        document.documentElement.classList.add('dark');
                        localStorage.theme = 'dark';
                    }
                });
            }
        });

        document.getElementById('year').innerText = new Date().getFullYear();

        function renderProjects() {
            const container = document.getElementById('projectsGrid');
            container.innerHTML = '';

            const filtered = activeCategory === 'all' 
                ? projects 
                : projects.filter(p => p.category === activeCategory);

            document.getElementById('projectCount').innerText = `Showing ${filtered.length} project${filtered.length === 1 ? '' : 's'}`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 border border-dashed border-slate-300 dark:border-slate-800 rounded-2xl">
                        <i class="fa-solid fa-folder-open text-3xl text-slate-400 mb-2"></i>
                        <p class="text-sm text-slate-500">No projects found in this category.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(p => {
                const card = document.createElement('article');
                card.className = 'bg-white dark:bg-slate-900/90 border border-slate-200 dark:border-slate-800/90 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition duration-200 flex flex-col md:flex-row group';
                
                const tagsHtml = p.tags.map(t => `<span class="px-2.5 py-0.5 text-[11px] font-medium rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700/60">${t.trim()}</span>`).join('');
                const dotsHtml = p.dots.map(d => `<li class="flex items-start text-xs sm:text-sm text-slate-600 dark:text-slate-300"><span class="text-brand-500 mr-2.5 font-bold select-none">•</span><span>${d.replace(/^[•\-\*]\s*/, '')}</span></li>`).join('');

                card.innerHTML = `
                    <div class="md:w-2/5 lg:w-5/12 bg-slate-100 dark:bg-slate-800/50 relative overflow-hidden min-h-[200px] md:min-h-full flex items-center justify-center border-b md:border-b-0 md:border-r border-slate-200 dark:border-slate-800">
                        <img src="${p.image}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.onerror=null; this.src='https://placehold.co/600x400/1e293b/94a3b8?text=Project+Photo';">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950/40 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition duration-300"></div>
                    </div>

                    <div class="p-5 sm:p-6 md:w-3/5 lg:w-7/12 flex flex-col justify-between">
                        <div>
                            <div class="flex items-start justify-between gap-2 mb-2">
                                <h2 class="text-base sm:text-lg font-bold text-slate-900 dark:text-white leading-snug">${p.title}</h2>
                                <div class="flex items-center gap-1 shrink-0">
                                    ${p.github ? `<a href="${p.github}" target="_blank" rel="noopener" class="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition" title="Source Code"><i class="fa-brands fa-github text-base"></i></a>` : ''}
                                    ${p.demo ? `<a href="${p.demo}" target="_blank" rel="noopener" class="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition" title="Live Demo / Report"><i class="fa-solid fa-arrow-up-right-from-square text-sm"></i></a>` : ''}
                                </div>
                            </div>

                            <div class="flex flex-wrap gap-1.5 mb-4">
                                ${tagsHtml}
                            </div>

                            <ul class="space-y-2 mb-4">
                                ${dotsHtml}
                            </ul>
                        </div>

                        <div class="pt-3 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between text-[11px] text-slate-400 font-mono">
                            <span>CATEGORY: ${p.category.toUpperCase()}</span>
                            <span>ID: #${p.id}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterProjects(cat) {
            activeCategory = cat;
            document.querySelectorAll('#filterTabs button').forEach(btn => {
                btn.classList.remove('bg-brand-600', 'text-white', 'active');
                btn.classList.add('bg-slate-200', 'dark:bg-slate-800', 'text-slate-700', 'dark:text-slate-300');
            });

            event.target.classList.remove('bg-slate-200', 'dark:bg-slate-800', 'text-slate-700', 'dark:text-slate-300');
            event.target.classList.add('bg-brand-600', 'text-white', 'active');

            renderProjects();
        }

        window.onload = function() {
            localStorage.removeItem('my_portfolio_projects');
            initTheme();
            renderProjects();
        };
    </script>
</body>
</html>
